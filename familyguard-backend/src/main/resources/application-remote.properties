# Perfil para un backend publicado detrás de un proxy HTTPS en el mismo servidor.
# El proxy termina TLS y reenvía solamente por loopback; MySQL permanece privado.
server.address=${FAMILYGUARD_BIND_ADDRESS:127.0.0.1}
server.port=${FAMILYGUARD_SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# Base de datos del servidor: credenciales obligatorias por variables de entorno (sin valores por defecto).
# Sustituyen, solo en este perfil, a la configuración local de application.properties, que no se modifica.
# Si falta alguna variable, el backend no arranca: nunca se usa root sin contraseña en un servidor.
spring.datasource.url=${FAMILYGUARD_DB_URL}
spring.datasource.username=${FAMILYGUARD_DB_USERNAME}
spring.datasource.password=${FAMILYGUARD_DB_PASSWORD}
# Migraciones Flyway con un usuario propio (con permisos de estructura); si no se define, se usa el de la aplicación.
spring.flyway.user=${FAMILYGUARD_FLYWAY_USERNAME:${FAMILYGUARD_DB_USERNAME}}
spring.flyway.password=${FAMILYGUARD_FLYWAY_PASSWORD:${FAMILYGUARD_DB_PASSWORD}}
# Un servidor nuevo crea también V11 (permisos temporales) y V12 (PIN parental y autorizaciones).
spring.flyway.locations=classpath:db/migration,classpath:db/pendiente
# Clave AES del PIN parental (Base64, 32 bytes): obligatoria en el servidor, nunca en archivos versionados.
familyguard.pin.clave=${FAMILYGUARD_PIN_KEY}

spring.datasource.hikari.maximum-pool-size=${FAMILYGUARD_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
