# Perfil "dev": base de datos de DESARROLLO AISLADA para pruebas manuales.
# Usa familyguard_dev (se crea vacía si no existe) y NUNCA toca familyguard_db.
# Arranque:  .\mvnw.cmd -pl familyguard-backend spring-boot:run "-Dspring-boot.run.profiles=dev"
# Usuario y contraseña de MySQL: los mismos de la instalación local, o las variables
# FAMILYGUARD_DEV_DB_USERNAME / FAMILYGUARD_DEV_DB_PASSWORD si se definen.
spring.datasource.url=${FAMILYGUARD_DEV_DB_URL:jdbc:mysql://127.0.0.1:3306/familyguard_dev?createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=
# En desarrollo se aplican también V11 (permisos temporales) y V12 (PIN parental y autorizaciones).
spring.flyway.locations=classpath:db/migration,classpath:db/pendiente
# Clave del PIN parental de desarrollo: archivo propio, fuera del proyecto.
familyguard.pin.archivo-clave=${user.home}/.familyguard/pin-servidor-dev.key
