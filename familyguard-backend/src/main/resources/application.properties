
# ============================================================
# FAMILYGUARD - CONFIGURACION DEL BACKEND
# Java 17 + Spring Boot 4.1.2 + MySQL 8.4.3
# Credenciales suministradas exclusivamente por el entorno de ejecución
# ============================================================

# ------------------------------------------------------------
# 1. CONFIGURACION GENERAL
# ------------------------------------------------------------
spring.application.name=familyguard-backend
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ------------------------------------------------------------
# 2. CONEXION MYSQL - LARAGON
# ------------------------------------------------------------
# Base de datos: familyguard_db
# Servidor: 127.0.0.1
# Puerto: 3306
# Usuario: root
# Contrasena: vacia
#
# IMPORTANTE:
# CONFIGURACION LOCAL FIJA.
# PROHIBIDO MODIFICAR ESTOS VALORES SIN AUTORIZACION.
# ------------------------------------------------------------

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/familyguard_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ------------------------------------------------------------
# 3. HIBERNATE Y SPRING DATA JPA
# ------------------------------------------------------------
# Validar tablas existentes sin modificarlas automaticamente.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------
# 4. MIGRACIONES FLYWAY
# ------------------------------------------------------------
# Ejecutar y validar migraciones versionadas.
# Prohibir la limpieza automatica de la base de datos.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# ------------------------------------------------------------
# 5. SEGURIDAD DE DATOS JSON
# ------------------------------------------------------------
# Rechazar propiedades inesperadas en las solicitudes.

spring.jackson.deserialization.fail-on-unknown-properties=true

# ------------------------------------------------------------
# 6. MONITOREO DEL SERVIDOR
# ------------------------------------------------------------
# Habilitar endpoints de salud e informacion.

management.endpoints.web.exposure.include=health,info

# ============================================================
# FIN DE CONFIGURACION FAMILYGUARD
# ============================================================

