spring.datasource.url=jdbc:h2:mem:familyguard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
# V11 y V12 (permisos temporales, PIN parental y autorizaciones) se aplican solo en bases de prueba/desarrollo.
spring.flyway.locations=classpath:db/migration,classpath:db/pendiente
familyguard.alertas-conexion.habilitadas=false
familyguard.pin.archivo-clave=target/test-pin-servidor.key
