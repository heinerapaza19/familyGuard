# Plantilla Nginx para el backend FamilyGuard (Etapa 7). NO se ha desplegado.
# Reemplace familyguard.example.com por el dominio autorizado. Certificado: Let's Encrypt (certbot).
# El backend escucha solo en 127.0.0.1:8080 (perfil "remote"); MySQL no se expone.

# Límites por IP en el proxy (complementan el bloqueo por cuenta y el límite de vinculación del backend).
limit_req_zone $binary_remote_addr zone=fg_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fg_vinculacion:10m rate=20r/m;

server {
    listen 80;
    server_name familyguard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name familyguard.example.com;

    ssl_certificate     /etc/letsencrypt/live/familyguard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familyguard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    # Las cabeceras se repiten en cada location porque Nginx no hereda proxy_set_header si se define alguna.
    # X-Forwarded-For se SOBRESCRIBE con la IP real: un cliente no puede falsearla (riesgo 2 de la Etapa 6).

    location = /api/auth/login {
        limit_req zone=fg_login burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/agent/link {
        limit_req zone=fg_vinculacion burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }

    # Avisos en tiempo real (SSE, Etapa 5): sin búfer y con conexiones de hasta 15 minutos.
    location = /api/agent/events {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        proxy_pass http://127.0.0.1:8080;
    }

    # Solo el estado de salud es público; el resto de Actuator no se publica.
    location = /actuator/health {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }
    location /actuator/ { return 404; }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8080;
    }
}
